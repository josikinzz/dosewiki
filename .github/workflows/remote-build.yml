name: Remote Build

# Upload one surface's source to Vercel and let Vercel's builders build it: a
# preview by default, or with target=production an unaliased production
# deployment (--prod --skip-domain). The runner only checks out, scans, stages
# the surface's cron jobs, and uploads; the build itself runs on Vercel with
# the project's own environment, next to nothing on this runner. Stops there:
# no step assigns an alias or promotes. Promotion stays in the manual release
# ceremony in docs/operations/deployment.md.
#
# Capabilities and limits are described in docs/operations/security-ci.md
# under "Remote build workflow".

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Artifact to build
        type: choice
        required: true
        options:
          - public
          - editor
          - effectindex
      ref:
        description: Git ref to build (a branch, tag, or full commit SHA; empty builds the ref this run was dispatched from)
        type: string
        required: false
        default: ""
      environment:
        description: GitHub environment holding the surface's Vercel deploy token and project id
        type: environment
        required: true
      target:
        description: Deployment target. production uploads an unaliased production deployment for the release ceremony to promote
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      dry_run:
        description: Only print what would be uploaded; no upload, no build
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One release build at a time across all surfaces, so builds reach the
# database in turn. GitHub keeps one queued run per group, so dispatch
# surfaces one after another; a newer dispatch replaces a queued one.
concurrency:
  group: remote-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.surface }} on Vercel
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_CLI: vercel@59.25.4

    steps:
      - name: Checkout the requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check for secrets in codebase
        run: node scripts/security/scan-secrets.mjs --tracked

      # The surface input names an artifact. scripts/build/build-surface.mjs, the
      # module next.config.ts reads, derives its build surface and flavor from
      # that name. The Vercel project's own environment sets the same values
      # for the build; the summary records what this artifact expects.
      - name: Resolve the artifact's build surface and flavor
        id: artifact
        env:
          ARTIFACT: ${{ inputs.surface }}
        run: node scripts/build/build-surface-cli.mjs outputs "$ARTIFACT" | tee -a "$GITHUB_OUTPUT"

      # The root vercel.json lists every project's cron jobs. Keep only the
      # jobs this artifact's project owns, so writer jobs never reach a public
      # deployment. The staged file is part of the upload.
      - name: Stage this artifact's cron jobs
        run: node scripts/deploy/stage-vercel-crons.mjs "${{ inputs.surface }}"

      - name: Print the upload plan (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run: ${{ inputs.surface }} on Vercel"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Surface / flavor | ${{ steps.artifact.outputs.surface }} / ${{ steps.artifact.outputs.flavor }} |"
            echo "| Target | ${{ inputs.target }} |"
            echo
            echo "Staged cron paths:"
            echo
            echo '```'
            node -e 'for (const c of require("./vercel.json").crons) console.log(c.schedule + "  " + c.path)'
            echo '```'
            echo
            echo "Nothing was uploaded or built."
          } >> "$GITHUB_STEP_SUMMARY"

      # vercel deploy uploads the checkout (minus .vercelignore) and Vercel runs
      # vercel.json's buildCommand (bun run build:vercel) with the project's
      # environment, so the function-reference check and the artifact audit run
      # there. The platform assigns the deployment ID that skew protection uses.
      # RELEASE_BUILD_ENABLED is the same explicit gate the policy workflow uses.
      - name: Upload the source for a Vercel build
        if: ${{ !inputs.dry_run }}
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RELEASE_BUILD_ENABLED: ${{ vars.RELEASE_BUILD_ENABLED }}
        run: |
          test "$RELEASE_BUILD_ENABLED" = "true" || { echo "::error::Selected environment must explicitly enable release builds"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is required in the selected environment"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is required in the selected environment"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is required in the selected environment"; exit 1; }
          # --archive=tgz: the source tree exceeds the 15000-file upload limit.
          prod_flags=""
          if [ "${{ inputs.target }}" = "production" ]; then prod_flags="--prod --skip-domain"; fi
          url="$(npx --yes "$VERCEL_CLI" deploy --archive=tgz --yes $prod_flags --token="$VERCEL_TOKEN")"
          test -n "$url" || { echo "::error::vercel deploy printed no deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish the job summary
        if: ${{ !inputs.dry_run && always() }}
        run: |
          {
            echo "## Remote build: ${{ inputs.surface }} on Vercel"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ref | \`${{ inputs.ref || github.ref }}\` at \`$(git rev-parse HEAD)\` |"
            echo "| Surface / flavor | ${{ steps.artifact.outputs.surface }} / ${{ steps.artifact.outputs.flavor }} |"
            echo "| Target | ${{ inputs.target }} |"
            echo "| Deployment | ${{ steps.deploy.outputs.url || 'not deployed (see the failed step)' }} |"
            echo
            echo "No alias was assigned. Promotion is a separate, manual step."
            echo "The build log, census, and elapsed time are on the Vercel deployment."
          } >> "$GITHUB_STEP_SUMMARY"
