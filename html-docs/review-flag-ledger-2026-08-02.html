<style>
:root{
  --bg:#faf6ee; --surface:#fffdf7; --surface2:#f4eee1; --border:rgba(62,48,34,.16);
  --rule:#3e3022; --pattern:rgba(62,48,34,.045);
  --text:#2b2218; --text-bright:#1a1309; --text-dim:#6b5c49;
  --major:#8c1d1d; --major-dim:rgba(140,29,29,.09);
  --minor:#8a5308; --minor-dim:rgba(138,83,8,.10);
  --note:#1e5c38; --note-dim:rgba(30,92,56,.10);
  --accent:#1e3a5f; --accent-dim:rgba(30,58,95,.08);
  --sel:#f0e7d4;
  --serif:"Besley",Georgia,serif; --mono:"Martian Mono","SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191410; --surface:#211b15; --surface2:#2a2219; --border:rgba(233,216,188,.14);
    --rule:#cdbb9e; --pattern:rgba(233,216,188,.04);
    --text:#e9ddc9; --text-bright:#f8f1e2; --text-dim:#a8967c;
    --major:#e69c9c; --major-dim:rgba(230,156,156,.10);
    --minor:#dfb069; --minor-dim:rgba(223,176,105,.10);
    --note:#95c9a6; --note-dim:rgba(149,201,166,.10);
    --accent:#a8c4e6; --accent-dim:rgba(168,196,230,.09);
    --sel:#33291d;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--text); background:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,var(--pattern) 31px,var(--pattern) 32px);
  font-size:16px; line-height:1.55;
}
.frame{max-width:1360px;margin:0 auto;padding:26px 22px 40px}
/* ── title block ── */
header.masthead{
  border-top:3px double var(--rule); border-bottom:3px double var(--rule);
  padding:22px 8px 18px; text-align:center; margin-bottom:8px; background:var(--surface);
}
.masthead .over{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.34em;text-transform:uppercase;color:var(--text-dim)}
.masthead h1{
  font-size:clamp(26px,3.6vw,40px); font-weight:800; letter-spacing:.02em;
  font-variant:small-caps; color:var(--text-bright); margin:6px 0 4px;
}
.masthead .sub{font-style:italic;font-size:15px;color:var(--text)}
.statrow{
  display:flex;flex-wrap:wrap;justify-content:center;gap:0;
  border-bottom:1px solid var(--border); background:var(--surface); margin-bottom:18px;
}
.stat{padding:12px 26px;border-left:1px solid var(--border);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-bright)}
.stat.major b{color:var(--major)} .stat.minor b{color:var(--minor)} .stat.note b{color:var(--note)}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim)}
/* ── layout ── */
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:840px){.cols{grid-template-columns:1fr}}
/* ── sidebar ── */
aside{position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);min-width:0}
.controls{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.controls input[type=search]{
  width:100%;padding:8px 10px;font-family:var(--mono);font-size:13px;color:var(--text-bright);
  background:var(--bg);border:1px solid var(--border);border-radius:0;
}
.controls input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:4px 9px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;user-select:none;
}
.pill.on{border-color:currentColor}
.pill.sev-major{color:var(--major)} .pill.sev-major.on{background:var(--major-dim)}
.pill.sev-minor{color:var(--minor)} .pill.sev-minor.on{background:var(--minor-dim)}
.pill.sev-note{color:var(--note)} .pill.sev-note.on{background:var(--note-dim)}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.selrow select{
  width:100%;min-width:0;padding:6px 6px;font-family:var(--mono);font-size:11px;color:var(--text);
  background:var(--bg);border:1px solid var(--border);
}
.metarow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.count-note{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-dim)}
.clearbtn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.sortbtn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text);background:var(--surface2);border:1px solid var(--border);cursor:pointer;padding:3px 8px}
nav#doclist{overflow-y:auto;flex:1;padding:6px 0 14px}
.grouphead{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--text-dim);padding:14px 14px 4px;border-bottom:1px solid var(--border);margin-bottom:2px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.grouphead em{font-style:normal;font-variant-numeric:tabular-nums}
.doc{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:5px 14px;color:var(--text);font-family:var(--serif);font-size:14.5px}
.doc:hover{background:var(--surface2)}
.doc.sel{background:var(--sel)}
.doc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc.sel .t{font-weight:600;color:var(--text-bright)}
.doc .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-dim)}
.doc .sevmark{font-family:var(--mono);font-size:11px;font-weight:600}
.sevmark.major{color:var(--major)} .sevmark.minor{color:var(--minor)} .sevmark.note{color:var(--note)}
/* ── reader ── */
main{min-width:0}
.readcard{background:var(--surface);border:1px solid var(--border);padding:26px 30px 30px}
.readhead{border-bottom:3px double var(--rule);padding-bottom:14px;margin-bottom:6px}
.readhead .no{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-dim)}
.readhead h2{font-size:clamp(22px,2.8vw,32px);font-weight:800;font-variant:small-caps;letter-spacing:.02em;color:var(--text-bright);margin:2px 0 6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--border);color:var(--text)}
.badge.cls{background:var(--accent-dim);color:var(--accent);border-color:currentColor}
a.portal{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.flagrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px;padding:16px 2px;border-bottom:1px solid var(--border)}
.flagrow:last-child{border-bottom:0}
.flagrow.dimmed{opacity:.38}
.fig{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-dim);padding-top:3px}
.flagtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.flabel{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border:1px solid currentColor;cursor:pointer;background:none}
.flabel.major{color:var(--major);background:var(--major-dim)}
.flabel.minor{color:var(--minor);background:var(--minor-dim)}
.flabel.note{color:var(--note);background:var(--note-dim)}
.fsev{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.fsev.major{color:var(--major)} .fsev.minor{color:var(--minor)} .fsev.note{color:var(--note)}
.fsec{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.05em}
.fnote{margin-top:6px;max-width:72ch;font-size:15.5px}
.emptystate{padding:60px 20px;text-align:center;font-style:italic;color:var(--text)}
.emptystate button{margin-top:10px}
footer{margin-top:26px;border-top:1px solid var(--border);padding-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--text-dim);text-align:center}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border);padding:1px 4px;background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){
  .readcard{animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

s uncovered for a substance described as habit-forming.","section":"tolerance"},{"label":"missing citations","severity":"major","note":"The article has no citations or sources despite making specific claims about dosage, animal studies, overdose deaths, market history, and legal scheduling.","section":"sources"},{"label":"formatting","severity":"minor","note":"The subjective-effects entry for respiratory depression is concatenated into the nausea description instead of being represented as its own effect.","section":"subjective-effects"},{"label":"skinny","severity":"minor","note":"Pharmacology contains pharmacodynamics and a receptor profile but no pharmacokinetics content.","section":"pharmacology"}]},{"slug":"zaleplon","title":"Zaleplon","psy":["Sedative","Depressant"],"chem":["Z-drug (nonbenzodiazepine hypnotic)","Pyrazolopyrimidine"],"flags":[{"label":"consider hiding","severity":"major","note":"The article is far too incomplete for publication, with most core reference sections absent."},{"label":"missing section","severity":"major","note":"The article lacks a summary despite presenting dosage, duration, and pharmacology information.","section":"summary"},{"label":"missing section","severity":"major","note":"Subjective effects are absent, leaving the article without a description of the experience and its effects.","section":"subjective-effects"},{"label":"missing section","severity":"major","note":"Interactions are absent despite this being a depressant article where interaction coverage is structurally warranted.","section":"interactions"},{"label":"missing section","severity":"major","note":"Tolerance and dependence information is absent.","section":"tolerance"},{"label":"missing section","severity":"major","note":"The harm-potential section is absent and needs substantive coverage.","section":"harm-potential"},{"label":"skinny","severity":"major","note":"Pharmacology consists only of two receptor-profile bullets and lacks both pharmacodynamics and pharmacokinetics. The second bullet also has mismatched parentheses and duplicated wording.","section":"pharmacology"},{"label":"missing citations","severity":"minor","note":"The dosage and duration tables contain no inline citations linking their values to the listed sources.","section":"dosage-duration"},{"label":"missing citations","severity":"minor","note":"The receptor-profile claims contain no inline citations linking them to the listed sources.","section":"pharmacology"}]},{"slug":"zolpidem","title":"Zolpidem","psy":["Sedative","Depressant","Atypical Hallucinogen"],"chem":["Z-drug (nonbenzodiazepine hypnotic)","Imidazopyridine"],"flags":[{"label":"missing citations","severity":"major","note":"The article makes extensive clinical, pharmacological, safety, historical, and legal claims without any section-level citations, despite listing 12 general references.","section":"sources"},{"label":"incomplete table","severity":"major","note":"The interactions section contains only five caution entries, including unrelated-looking alphabetic entries, and omits the interaction categories and common depressant combinations discussed elsewhere in the article.","section":"interactions"},{"label":"summary drift","severity":"major","note":"The Full Tolerance subsection discusses general tolerability and short-term maintained efficacy rather than whether or how tolerance develops. Its low-tolerance framing also sits uneasily beside the article's descriptions of dependence and withdrawal.","section":"tolerance"},{"label":"formatting","severity":"minor","note":"The subjective-effects hierarchy exposes serialized field syntax such as “Description: …; Name: …” and contains empty hallucinatory headings, making the section read like unrendered structured data.","section":"subjective-effects"},{"label":"misplaced content","severity":"minor","note":"The dosage section includes prose about complex sleep behaviors and seven-hour impairment that belongs under effects or harm potential; its absorption note belongs under pharmacokinetics and is already duplicated there.","section":"dosage-duration"},{"label":"duration mismatch","severity":"minor","note":"After-effects are listed as lasting up to 24 hours while total duration is listed as only 5–10 hours, without explaining whether total duration excludes residual effects.","section":"dosage-duration"},{"label":"incomplete table","severity":"minor","note":"The threshold and light dose tiers overlap at 2.5 mg, so a dose of exactly 2.5 mg belongs to both categories.","section":"dosage-duration"},{"label":"formatting","severity":"minor","note":"The Development and Approval history entry has a date range ending in 1992 even though the same entry covers generic availability in 2007 and prescribing data from 2023.","section":"history-culture"},{"label":"misplaced content","severity":"minor","note":"“Antibiotic Function” appears as an unknown toxicity field even though the article provides no antibiotic context; it reads as an irrelevant schema artifact rather than harm-potential content.","section":"harm-potential"}]},{"slug":"zopiclone","title":"Zopiclone","psy":["Sedative","Depressant"],"chem":["Cyclopyrrolone"],"flags":[{"label":"incomplete table","severity":"major","note":"The oral dosage tiers overlap because Threshold is written as ≥ 3.5 mg, placing every listed dose in both the threshold tier and another tier. Replace it with a bounded threshold range consistent with the remaining tiers.","section":"dosage-duration"},{"label":"incomplete table","severity":"minor","note":"The duration table allows After Effects to last 12 hours while Total Duration ends at 9 hours. Clarify whether after-effects are excluded from the total or correct the ranges.","section":"dosage-duration"},{"label":"formatting","severity":"minor","note":"The subjective-effects section exposes schema-like Attribution, Author, Text, URL, Effects, Name, and Description headings and fields instead of presenting them as reader-facing prose and lists.","section":"subjective-effects"},{"label":"summary drift","severity":"minor","note":"The metabolites list definitively labels N-desmethylzopiclone active and zopiclone-N-oxide weakly active, while the pharmacokinetics prose says both classifications are disputed and sometimes reported as inactive.","section":"pharmacology"},{"label":"skinny","severity":"major","note":"The interactions section contains only five alphabetically adjacent drug names and gives no explanation of interaction mechanisms, severity, or major depressant combinations. It is far too incomplete for the article's harm-reduction scope.","section":"interactions"},{"label":"missing citations","severity":"major","note":"The article makes numerous specific pharmacology, dependence, impairment, history, and legal claims, but none of its body sections connect those claims to the nine listed references.","section":"sources"}]}]</script>
<script>
const DATA = JSON.parse(document.getElementById("corpus").textContent);
DATA.forEach(a => { a.psy = a.psy || []; a.chem = a.chem || []; a.group = a.psy[0] || "Unclassified"; });
const SEVRANK = { major: 0, minor: 1, note: 2 };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const st = { q: "", sevs: new Set(), label: "", sec: "", sel: null, sort: "az" };

const allLabels = {}, allSecs = {};
let totMajor = 0, totMinor = 0, totNote = 0;
DATA.forEach(a => a.flags.forEach(f => {
  allLabels[f.label] = (allLabels[f.label] || 0) + 1;
  allSecs[f.section || "(article-level)"] = (allSecs[f.section || "(article-level)"] || 0) + 1;
  if (f.severity === "major") totMajor++; else if (f.severity === "minor") totMinor++; else totNote++;
}));
const labelSel = document.getElementById("labelsel"), secSel = document.getElementById("secsel");
Object.entries(allLabels).sort((x, y) => y[1] - x[1]).forEach(([l, n]) => {
  labelSel.insertAdjacentHTML("beforeend", `<option value="${esc(l)}">${esc(l)} (${n})</option>`);
});
Object.entries(allSecs).sort((x, y) => y[1] - x[1]).forEach(([s, n]) => {
  secSel.insertAdjacentHTML("beforeend", `<option value="${esc(s)}">${esc(s)} (${n})</option>`);
});
document.getElementById("stats").innerHTML =
  `<div class="stat"><b>${DATA.length}</b><span>articles</span></div>` +
  `<div class="stat"><b>${totMajor + totMinor + totNote}</b><span>flags</span></div>` +
  `<div class="stat major"><b>${totMajor}</b><span>major</span></div>` +
  `<div class="stat minor"><b>${totMinor}</b><span>minor</span></div>` +
  `<div class="stat note"><b>${totNote}</b><span>note</span></div>`;

function flagMatches(f) {
  if (st.sevs.size && !st.sevs.has(f.severity)) return false;
  if (st.label && f.label !== st.label) return false;
  if (st.sec && (f.section || "(article-level)") !== st.sec) return false;
  return true;
}
function docMatches(a) {
  const hasFlag = a.flags.some(flagMatches);
  if (!hasFlag && (st.sevs.size || st.label || st.sec)) return false;
  if (!st.q) return true;
  const q = st.q.toLowerCase();
  return a.title.toLowerCase().includes(q) || a.slug.includes(q) ||
    a.psy.concat(a.chem).some(c => c.toLowerCase().includes(q)) ||
    a.flags.some(f => f.label.toLowerCase().includes(q) || f.note.toLowerCase().includes(q));
}
function worstSev(a) { let w = 3; a.flags.forEach(f => { w = Math.min(w, SEVRANK[f.severity]); }); return ["major", "minor", "note", ""][w]; }
function visibleDocs() {
  const v = DATA.filter(docMatches);
  if (st.sort === "flags") v.sort((x, y) => y.flags.length - x.flags.length || x.title.localeCompare(y.title));
  else v.sort((x, y) => x.title.localeCompare(y.title, undefined, { sensitivity: "base" }));
  return v;
}
function renderList() {
  const v = visibleDocs();
  const nav = document.getElementById("doclist");
  let html = "";
  if (st.sort === "flags") {
    html += v.map(docRow).join("");
  } else {
    const groups = {};
    v.forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
    Object.keys(groups).sort().forEach(g => {
      html += `<div class="grouphead"><span>${esc(g)}</span><em>${groups[g].length}</em></div>` + groups[g].map(docRow).join("");
    });
  }
  nav.innerHTML = html || `<div class="emptystate">No articles match.<br><button class="clearbtn" onclick="clearAll()">clear filters</button></div>`;
  const anyFilter = st.q || st.sevs.size || st.label || st.sec;
  document.getElementById("countnote").textContent = `${v.length} of ${DATA.length} articles`;
  document.getElementById("clearbtn").hidden = !anyFilter;
  if (st.sel && !v.some(a => a.slug === st.sel)) { /* keep selection but it may be filtered out of nav */ }
}
function docRow(a) {
  const w = worstSev(a);
  return `<button class="doc${a.slug === st.sel ? " sel" : ""}" data-slug="${esc(a.slug)}">` +
    `<span class="sevmark ${w}">${w ? "●" : ""}</span><span class="t">${esc(a.title)}</span><span class="n">${a.flags.length}</span></button>`;
}
function renderReader() {
  const r = document.getElementById("reader");
  const a = DATA.find(x => x.slug === st.sel);
  if (!a) { r.innerHTML = `<div class="emptystate">Select an article from the ledger.<br><small>Navigate with <kbd>j</kbd>/<kbd>k</kbd>, search with <kbd>/</kbd>. Click any flag label to filter by it.</small></div>`; return; }
  const flags = a.flags.slice().sort((x, y) => SEVRANK[x.severity] - SEVRANK[y.severity]);
  const anyFlagFilter = st.sevs.size || st.label || st.sec;
  r.innerHTML =
    `<div class="readhead"><div class="no">entry ${esc(a.slug)} · ${a.flags.length} flag${a.flags.length === 1 ? "" : "s"}</div>` +
    `<h2>${esc(a.title)}</h2>` +
    `<div class="badges">${a.psy.map(c => `<span class="badge cls">${esc(c)}</span>`).join("")}${a.chem.map(c => `<span class="badge">${esc(c)}</span>`).join("")}` +
    `<a class="portal" href="https://dosewiki-admin.vercel.app/review/${esc(a.slug)}" target="_blank" rel="noopener">open in review portal ↗</a></div></div>` +
    (flags.length ? flags.map((f, i) =>
      `<div class="flagrow${anyFlagFilter && !flagMatches(f) ? " dimmed" : ""}">` +
      `<div class="fig">${String(i + 1).padStart(2, "0")}</div><div>` +
      `<div class="flagtop"><button class="flabel ${esc(f.severity)}" data-label="${esc(f.label)}" title="Filter ledger by this label">${esc(f.label)}</button>` +
      `<span class="fsev ${esc(f.severity)}">${esc(f.severity)}</span>` +
      (f.section ? `<span class="fsec">§ ${esc(f.section)}</span>` : `<span class="fsec">article-level</span>`) +
      `</div><p class="fnote">${esc(f.note)}</p></div></div>`).join("")
    : `<div class="emptystate">No flags recorded for this article.</div>`);
  document.getElementById("foot").innerHTML =
    `Generated 2026-08-02 · dosewiki@theme-lab · built from runs/article-review-2026-08-02/findings (274 files) · reviewer: openai/gpt-5.6-sol, reasoning low · advisory only — flags never gate approval (ADR 0003)`;
}
function renderAll() { renderList(); renderReader(); }
function clearAll() { st.q = ""; st.sevs.clear(); st.label = ""; st.sec = "";
  document.getElementById("q").value = ""; labelSel.value = ""; secSel.value = "";
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("on")); renderAll(); }
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value.trim(); renderList(); });
document.getElementById("sevpills").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (!b) return;
  const s = b.dataset.sev; st.sevs.has(s) ? st.sevs.delete(s) : st.sevs.add(s);
  b.classList.toggle("on"); renderAll();
});
labelSel.addEventListener("change", () => { st.label = labelSel.value; renderAll(); });
secSel.addEventListener("change", () => { st.sec = secSel.value; renderAll(); });
document.getElementById("clearbtn").addEventListener("click", clearAll);
document.getElementById("sortbtn").addEventListener("click", e => {
  st.sort = st.sort === "az" ? "flags" : "az";
  e.target.textContent = st.sort === "az" ? "A–Z" : "by flags"; renderList();
});
document.getElementById("doclist").addEventListener("click", e => {
  const b = e.target.closest(".doc"); if (!b) return;
  st.sel = b.dataset.slug; location.hash = st.sel; renderAll();
});
document.getElementById("reader").addEventListener("click", e => {
  const b = e.target.closest(".flabel"); if (!b) return;
  st.label = b.dataset.label; labelSel.value = st.label; renderAll();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); return; }
  if (e.key === "j" || e.key === "k" || e.key === "ArrowDown" || e.key === "ArrowUp") {
    const v = visibleDocs(); if (!v.length) return;
    let i = v.findIndex(a => a.slug === st.sel);
    i = (e.key === "j" || e.key === "ArrowDown") ? Math.min(i + 1, v.length - 1) : Math.max(i - 1, 0);
    st.sel = v[i].slug; location.hash = st.sel; renderAll();
    const el = document.querySelector(`.doc[data-slug="${CSS.escape(st.sel)}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  }
});
if (location.hash) { const h = decodeURIComponent(location.hash.slice(1)); if (DATA.some(a => a.slug === h)) st.sel = h; }
renderAll();
</script>
</body>
</html>
