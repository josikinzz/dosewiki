  <title id="effectindex-mark-title">Effect Index</title>
  <!--
    Eye-only extraction of the Effect Index lockup (EffectIndex repo: static/logo.svg,
    potrace output, 569x247). Only the two eye paths (svg_2: almond + iris ring,
    svg_3: pupil + catchlight) are kept; the ten letterform paths that spell
    "Effect Index" are dropped because every call site pairs this mark with a separate
    text wordmark. The group transform from the source file is preserved verbatim so the
    curve data is untouched; the viewBox is the measured bounding box of those two paths.

    Rendered as a CSS mask (alpha channel) by DoseWikiLogo, so this fill is only what you
    see when the file is opened directly or used as an <img>: ink, not the original white,
    because the Effect Index deployment is light.
  -->
