<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color-meta" name="theme-color" content="#0f0a1f" />
    <script>
      (() => {
        const STORAGE_KEY = "dosewiki-theme";
        const THEMES = { dark: "#0f0a1f", light: "#f6efff" };

        try {
          const storedTheme = window.localStorage.getItem(STORAGE_KEY);
          const theme = storedTheme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;

          const meta = document.getElementById("theme-color-meta");
          if (meta) {
            meta.setAttribute("content", THEMES[theme]);
          }
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <!-- SEO Meta Tags -->
    <meta name="description" content="dose.wiki is a harm reduction database providing dosage, duration, effects, and safety information for psychoactive substances." />
    <meta name="keywords" content="harm reduction, drug information, dosage, psychoactive substances, drug safety, effects, interactions" />
    <meta name="author" content="dose.wiki Contributors" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dose.wiki" />
    <meta property="og:title" content="dose.wiki - Substance Information Database" />
    <meta property="og:description" content="Harm reduction database providing dosage, duration, effects, and safety information for psychoactive substances." />
    <meta property="og:url" content="https://dose.wiki" />
    <meta property="og:image" content="https://dose.wiki/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="dose.wiki logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="dose.wiki - Substance Information Database" />
    <meta name="twitter:description" content="Harm reduction database for psychoactive substances." />
    <meta name="twitter:image" content="https://dose.wiki/icon-512.png" />

    <!-- Canonical URL (updated dynamically by app) -->
    <link rel="canonical" href="https://dose.wiki" />

    <!-- Favicons and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://enchanted-echidna-791.convex.cloud" />
    <link rel="dns-prefetch" href="https://glad-minnow-656.convex.cloud" />

    <title>dose.wiki - Substance Information Database</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
