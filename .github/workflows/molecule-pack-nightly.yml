name: Molecule Pack Nightly

on:
  schedule:
    - cron: "30 9 * * *" # daily, 09:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-pack:
    name: Rebuild molecule download pack from Convex
    runs-on: ubuntu-latest
    env:
      SOURCE_CONVEX_URL: https://glad-minnow-656.convex.cloud

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the molecule pack from Convex
        run: npm run molecules:pack

      - name: Commit and push the refreshed pack
        run: |
          if [ -z "$(git status --porcelain -- public/dosewiki-molecules.zip public/dosewiki-molecules.json)" ]; then
            echo "Pack unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dosewiki-molecules.zip public/dosewiki-molecules.json
          git commit -m "chore: nightly molecule pack refresh"
          git push
